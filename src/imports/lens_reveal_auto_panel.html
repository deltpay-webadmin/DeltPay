
<style>
  .scene {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    padding: 80px 0 60px;
    text-align: center;
  }
  .headline {
    font-family: var(--font-sans);
    font-size: clamp(32px, 5.5vw, 60px);
    font-weight: 500;
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: var(--color-text-primary);
    margin: 0;
  }
  .word-wrap {
    position: relative;
    display: inline-block;
    vertical-align: baseline;
  }
  .layer-blurred {
    display: inline-block;
    color: var(--color-text-primary);
    filter: blur(5px);
    opacity: 0.3;
  }
  .layer-clear {
    position: absolute;
    top: 0;
    left: 0;
    display: inline-block;
    color: var(--color-text-primary);
    white-space: nowrap;
    clip-path: inset(0 100% 0 0);
  }
</style>

<div class="scene">
  <p class="headline">
    A <span class="word-wrap">
      <span class="layer-blurred">clearer</span>
      <span class="layer-clear" id="clear">clearer</span>
    </span> view into<br>every part of your business.
  </p>
</div>

<script>
const clear = document.getElementById('clear');

let progress = 0;
let direction = 1;
let paused = false;
let pauseTimer = null;
const SPEED = 0.0048;

function ease(t) {
  return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
}

function tick() {
  if (!paused) {
    progress += SPEED * direction;

    if (progress >= 1) {
      progress = 1;
      direction = -1;
      paused = true;
      clearTimeout(pauseTimer);
      pauseTimer = setTimeout(() => { paused = false; }, 1800);
    } else if (progress <= 0) {
      progress = 0;
      direction = 1;
      paused = true;
      clearTimeout(pauseTimer);
      pauseTimer = setTimeout(() => { paused = false; }, 1200);
    }
  }

  const p = ease(Math.max(0, Math.min(1, progress)));
  clear.style.clipPath = `inset(0 ${(100 - p * 100).toFixed(2)}% 0 0)`;

  requestAnimationFrame(tick);
}

requestAnimationFrame(tick);
</script>
