<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delt — Payments</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap');
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap");

    :root {
      --navy: #080e1a;
      --indigo: #4318FF;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Inter', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--sans);
      background: var(--navy);
      color: #fff;
      overflow-x: hidden;
    }

    /* ── Full-screen data stream ── */
    .stream-container {
      position: relative;
      height: 500vh;
    }

    .stream-sticky {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--navy);
    }

    #streamCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .center-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      animation: logoPulse 3s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.4; }
    }

    .cl-icon {
      display: flex;
      align-items: flex-end;
      gap: 3px;
    }

    .cl-b1 {
      width: 10px;
      height: 22px;
      background: var(--indigo);
      border-radius: 5px;
    }

    .cl-b2 {
      width: 10px;
      height: 34px;
      background: var(--indigo);
      border-radius: 5px;
    }

    .cl-b3 {
      width: 10px;
      height: 14px;
      background: #7c5cfc;
      border-radius: 50%;
      margin-bottom: 22px;
    }

    .cl-text {
      font-family: var(--mono);
      font-size: 40px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    /* ── Headline reveal ── */
    .reveal-layer {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      pointer-events: none;
    }

    .reveal-eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--indigo);
      margin-bottom: 28px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.8s, transform 0.8s;
    }

    .reveal-headline {
      font-size: clamp(36px, 5.5vw, 72px);
      font-weight: 900;
      line-height: 1.06;
      letter-spacing: -0.035em;
      color: #fff;
      margin-bottom: 28px;
      min-height: 2.2em;
    }

    .reveal-headline .typed-char {
      opacity: 0;
      display: inline-block;
      transition: opacity 0.05s;
    }

    .reveal-headline .typed-char.visible {
      opacity: 1;
    }

    .reveal-headline .typed-char.space {
      width: 0.3em;
    }

    .reveal-headline .cursor-blink {
      display: inline-block;
      width: 3px;
      height: 0.9em;
      background: var(--indigo);
      margin-left: 2px;
      animation: cursorBlink 0.7s step-end infinite;
      vertical-align: baseline;
    }

    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .reveal-sub {
      font-size: 16px;
      font-weight: 400;
      line-height: 1.7;
      color: rgba(255,255,255,0.45);
      max-width: 48ch;
      margin-bottom: 40px;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.8s 0.3s, transform 0.8s 0.3s;
    }

    .reveal-cta {
      display: flex;
      gap: 14px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.8s 0.6s, transform 0.8s 0.6s;
    }

    .reveal-cta.show,
    .reveal-sub.show,
    .reveal-eyebrow.show {
      opacity: 1;
      transform: translateY(0);
    }

    .btn-primary {
      background: var(--indigo);
      color: #fff;
      border: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--sans);
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .btn-primary:hover {
      background: #3510d4;
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(67,24,255,0.3);
    }

    .btn-ghost {
      background: transparent;
      color: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--sans);
      transition: all 0.2s;
    }

    .btn-ghost:hover {
      border-color: rgba(255,255,255,0.35);
      color: #fff;
    }

    /* ── Live counter ── */
    .live-counter {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      gap: 32px;
      opacity: 0;
      transition: opacity 0.8s 0.9s;
      pointer-events: none;
    }

    .live-counter.show {
      opacity: 1;
    }

    .counter-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .counter-value {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .counter-label {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
    }

    .counter-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
      display: inline-block;
      animation: counterPulse 2s ease-in-out infinite;
    }

    @keyframes counterPulse {
      0%, 100% {
        opacity: 1;
        box-shadow: 0 0 0 0 rgba(34,197,94,0.4);
      }
      50% {
        opacity: 0.7;
        box-shadow: 0 0 0 4px rgba(34,197,94,0);
      }
    }

    /* ── Scroll indicator ── */
    .scroll-hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: opacity 0.4s;
    }

    .scroll-hint-text {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.15);
    }

    .scroll-chevron {
      width: 10px;
      height: 10px;
      border-right: 1px solid rgba(255,255,255,0.15);
      border-bottom: 1px solid rgba(255,255,255,0.15);
      transform: rotate(45deg);
      animation: chevBounce 2s ease-in-out infinite;
    }

    @keyframes chevBounce {
      0%, 100% {
        transform: rotate(45deg) translateY(0);
        opacity: 0.2;
      }
      50% {
        transform: rotate(45deg) translateY(5px);
        opacity: 0.7;
      }
    }
  </style>
</head>
<body>

  <div class="scroll-hint" id="scrollHint">
    <span class="scroll-hint-text">Scroll</span>
    <div class="scroll-chevron"></div>
  </div>

  <div class="stream-container">
    <div class="stream-sticky">
      <canvas id="streamCanvas"></canvas>

      <div class="center-logo" id="centerLogo">
        <div class="cl-icon">
          <div class="cl-b3"></div>
          <div class="cl-b1"></div>
          <div class="cl-b2"></div>
        </div>
        <div class="cl-text">Delt</div>
      </div>

      <div class="reveal-layer" id="revealLayer">
        <div class="reveal-eyebrow" id="rEyebrow">Payment Processing</div>
        <div class="reveal-headline" id="rHeadline"></div>
        <div class="reveal-sub" id="rSub">
          Bank-grade encryption on every payment. PCI-DSS compliant. TLS&nbsp;1.3. AES-256. Zero exposure — built&nbsp;in, not&nbsp;bolted&nbsp;on.
        </div>
        <div class="reveal-cta" id="rCta">
          <button class="btn-primary">Get Started — Free →</button>
          <button class="btn-ghost">Talk to Sales</button>
        </div>
      </div>

      <div class="live-counter" id="liveCounter">
        <div class="counter-item">
          <div class="counter-value"><span class="counter-dot"></span><span id="txnCount">0</span></div>
          <div class="counter-label">Transactions today</div>
        </div>
        <div class="counter-item">
          <div class="counter-value">$<span id="volCount">0</span></div>
          <div class="counter-label">Volume processed</div>
        </div>
        <div class="counter-item">
          <div class="counter-value"><span id="uptimeCount">99.99</span>%</div>
          <div class="counter-label">Uptime</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ═══════════════════════════════════════
       Full-screen encrypted stream
       ═══════════════════════════════════════ */
    const canvas = document.getElementById('streamCanvas');
    const ctx = canvas.getContext('2d');

    const tokens = ['VISA','MC','AMEX','AUTH:','TXN:','CVV:','$','BIN:','PCI','EMV','NFC','ACH','3DS','P2PE','EXP:','REF:','BATCH:','APPROVED','ENCRYPTED','TOKENIZED','SETTLEMENT','CAPTURE'];
    const noise = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
    const hex = '0123456789abcdef';
    const digits = '0123456789';

    const FONT_SIZE = 11;
    const COL_W = 7;
    let cols, rows, columns = [];

    function rc() {
      return noise[Math.floor(Math.random() * noise.length)];
    }

    function rHex(n) {
      let s = '';
      for (let i = 0; i < n; i++) s += hex[Math.floor(Math.random() * 16)];
      return s;
    }

    function rDig(n) {
      let s = '';
      for (let i = 0; i < n; i++) s += digits[Math.floor(Math.random() * 10)];
      return s;
    }

    function makeStr() {
      const r = Math.random();
      if (r < 0.08) return tokens[Math.floor(Math.random() * tokens.length)] + rHex(4);
      if (r < 0.15) return rDig(4) + ' ' + rDig(4);
      if (r < 0.22) return '$' + (Math.random() * 9999).toFixed(2);
      let s = '';
      for (let i = 0; i < Math.floor(Math.random() * 8) + 3; i++) s += rc();
      return s;
    }

    function initCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      cols = Math.floor(window.innerWidth / COL_W);
      rows = Math.floor(window.innerHeight / FONT_SIZE) + 2;
      columns = [];

      for (let i = 0; i < cols; i++) {
        const chars = [];
        const speed = 0.3 + Math.random() * 0.8;
        let y = -Math.random() * window.innerHeight;

        for (let j = 0; j < rows; j++) {
          chars.push({ char: rc(), y: y + j * FONT_SIZE, life: Math.random() });

          if (Math.random() < 0.05) {
            const str = makeStr();
            for (let k = 0; k < str.length && j + k < rows; k++) {
              chars[chars.length - 1 + k] = chars[chars.length - 1 + k] || {
                char: str[k],
                y: y + (j + k) * FONT_SIZE,
                life: Math.random()
              };
              if (chars[j + k]) chars[j + k].char = str[k];
            }
          }
        }

        columns.push({ chars, speed, x: i * COL_W });
      }
    }

    initCanvas();
    window.addEventListener('resize', initCanvas);

    let scrollProgress = 0;

    function drawStream() {
      const w = window.innerWidth;
      const h = window.innerHeight;

      ctx.clearRect(0, 0, w, h);
      ctx.font = `500 ${FONT_SIZE}px 'JetBrains Mono', monospace`;
      ctx.textBaseline = 'top';

      const centerX = w / 2;
      const centerY = h / 2;
      const maxR = Math.sqrt(w * w + h * h) / 2;

      const clearRadius =
        scrollProgress < 0.3
          ? (scrollProgress / 0.3) * maxR * 0.6
          : maxR * 0.6 + ((scrollProgress - 0.3) / 0.7) * maxR * 0.4;

      for (let c = 0; c < columns.length; c++) {
        const col = columns[c];

        for (let j = 0; j < col.chars.length; j++) {
          const ch = col.chars[j];
          ch.y += col.speed;

          if (ch.y > h + FONT_SIZE) {
            ch.y = -FONT_SIZE;
            ch.char = rc();
          }

          if (Math.random() < 0.008) ch.char = rc();

          const dx = col.x + COL_W / 2 - centerX;
          const dy = ch.y + FONT_SIZE / 2 - centerY;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < clearRadius - 30) continue;

          let alpha = 0.12;
          if (dist < clearRadius + 40) {
            const edgeFactor = 1 - Math.abs(dist - clearRadius) / 40;
            alpha = 0.12 + edgeFactor * 0.25;
          }

          if (scrollProgress > 0.7) {
            alpha *= Math.max(0, 1 - (scrollProgress - 0.7) / 0.3);
          }

          ctx.fillStyle = `rgba(255,255,255,${alpha})`;
          ctx.fillText(ch.char, col.x, ch.y);
        }
      }

      requestAnimationFrame(drawStream);
    }

    requestAnimationFrame(drawStream);

    /* ═══════════════════════════════════════
       Typewriter headline
       ═══════════════════════════════════════ */
    const headlineText = "Every transaction,\nprotected.";
    const rHeadline = document.getElementById('rHeadline');
    const rEyebrow = document.getElementById('rEyebrow');
    const rSub = document.getElementById('rSub');
    const rCta = document.getElementById('rCta');
    const liveCounter = document.getElementById('liveCounter');
    const scrollHint = document.getElementById('scrollHint');
    const centerLogo = document.getElementById('centerLogo');
    const txnCount = document.getElementById('txnCount');
    const volCount = document.getElementById('volCount');

    let charEls = [];

    function buildHeadline() {
      rHeadline.innerHTML = '';
      charEls = [];

      for (let i = 0; i < headlineText.length; i++) {
        if (headlineText[i] === '\n') {
          rHeadline.appendChild(document.createElement('br'));
          continue;
        }

        const span = document.createElement('span');
        span.className = 'typed-char' + (headlineText[i] === ' ' ? ' space' : '');
        span.textContent = headlineText[i];
        rHeadline.appendChild(span);
        charEls.push(span);
      }

      const cursor = document.createElement('span');
      cursor.className = 'cursor-blink';
      cursor.id = 'typeCursor';
      rHeadline.appendChild(cursor);
    }

    buildHeadline();

    let lastTypedIndex = -1;

    function updateTypewriter(progress) {
      let targetIdx = -1;

      if (progress > 0) {
        targetIdx = Math.floor(progress * charEls.length) - 1;
        targetIdx = Math.min(targetIdx, charEls.length - 1);
      }

      if (targetIdx === lastTypedIndex) return;

      for (let i = 0; i < charEls.length; i++) {
        if (i <= targetIdx) charEls[i].classList.add('visible');
        else charEls[i].classList.remove('visible');
      }

      lastTypedIndex = targetIdx;

      const cursor = document.getElementById('typeCursor');
      if (cursor) {
        cursor.style.display = targetIdx >= charEls.length - 1 ? 'none' : 'inline-block';
      }
    }

    /* ═══════════════════════════════════════
       Live counters
       ═══════════════════════════════════════ */
    let txnBase = 847293;
    let volBase = 12.4;

    function tickCounters() {
      txnBase += Math.floor(Math.random() * 3);
      volBase += Math.random() * 0.01;
      txnCount.textContent = txnBase.toLocaleString();
      volCount.textContent = volBase.toFixed(1) + 'M';
    }

    setInterval(tickCounters, 800);
    tickCounters();

    /* ═══════════════════════════════════════
       Scroll controller
       ═══════════════════════════════════════ */
    function onScroll() {
      const total = document.querySelector('.stream-container').offsetHeight - window.innerHeight;
      const p = Math.min(1, Math.max(0, window.scrollY / total));
      scrollProgress = p;

      const logoOp = Math.max(0, 1 - p / 0.08);
      centerLogo.style.opacity = logoOp;

      if (p > 0.02) centerLogo.style.animation = 'none';

      scrollHint.style.opacity = Math.max(0, 1 - p / 0.05);

      const typeProgress = Math.min(1, Math.max(0, (p - 0.2) / 0.3));
      updateTypewriter(typeProgress);

      if (p > 0.18) rEyebrow.classList.add('show');
      else rEyebrow.classList.remove('show');

      if (p > 0.48) rSub.classList.add('show');
      else rSub.classList.remove('show');

      if (p > 0.52) rCta.classList.add('show');
      else rCta.classList.remove('show');

      if (p > 0.52) rCta.style.pointerEvents = 'auto';
      else rCta.style.pointerEvents = 'none';

      if (p > 0.56) liveCounter.classList.add('show');
      else liveCounter.classList.remove('show');
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  </script>
</body>
</html>
