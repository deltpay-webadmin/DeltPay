# Function-level config, committed so the JWT-verification posture of each
# endpoint is reproducible instead of living only as dashboard state.
#
# verify_jwt = false is ONLY for endpoints that authenticate another way:
#   - plaid-webhook:    called by Plaid (no Supabase JWT); verifies the
#                       Plaid-Verification ES256 JWT + body hash (enforced in
#                       production, log-only in sandbox; override with the
#                       PLAID_WEBHOOK_VERIFY secret: enforce|log|off).
#   - docusign-connect: called by DocuSign Connect; HMAC-verified
#                       (DOCUSIGN_CONNECT_HMAC_KEY), fails closed.
#   - plaid-config-check: public config self-check (returns booleans only).
#
# The pg_cron jobs dispatcher lives INSIDE make-server-940653c6 (POST /jobs,
# gated by x-cron-secret); pg_cron sends the public anon key to satisfy the
# platform JWT check, so that function keeps verify_jwt = true.

# The Hono server deploys under the slug make-server-940653c6 (the URL the
# CRM frontend calls), but its source lives in functions/server/. Without
# this entrypoint mapping, `supabase functions deploy server` publishes a
# stray `server` slug that nothing calls (this happened — the dashboard may
# still show it; safe to delete). Deploy with:
#   supabase functions deploy make-server-940653c6
[functions.make-server-940653c6]
entrypoint = "./functions/server/index.tsx"
verify_jwt = true

[functions.plaid-webhook]
verify_jwt = false

[functions.docusign-connect]
verify_jwt = false

[functions.plaid-config-check]
verify_jwt = false

# The rest of the functions require a signed-in Supabase user. verify_jwt =
# true is the platform default, but it's pinned here so the posture of every
# deployed function is in this file, as the header above promises.
[functions.docusign]
verify_jwt = true

[functions.analyze-statement]
verify_jwt = true

[functions.extract-deal-doc]
verify_jwt = true

[functions.nebius-chat]
verify_jwt = true
