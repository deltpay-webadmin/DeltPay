<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delt — Run, grow, and fund your business</title>
    <meta
      name="description"
      content="Delt is the all-in-one platform to run, grow, and fund your business — payments, capital, hardware, websites, and Lens AI."
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }

      /* ── Initial app loader ─────────────────────────────────────
         Inlined so it paints instantly, before any JS or images
         load. Removed by main.tsx once React mounts AND a minimum
         display time has elapsed (so it doesn't just flash by).
         Uses the real Delt wordmark (public/delt-logo.svg). */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        background: #041e42;
        transition: opacity 0.5s ease;
      }
      #app-loader.app-loader--hidden {
        opacity: 0;
        pointer-events: none;
      }

      .app-loader__logo {
        width: clamp(150px, 22vw, 210px);
        height: auto;
        opacity: 0;
        transform: translateY(8px) scale(0.98);
        animation: app-loader-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards,
          app-loader-breathe 2.6s ease-in-out 0.7s infinite;
      }

      /* Slim progress track + indeterminate sweep */
      .app-loader__track {
        position: relative;
        width: clamp(160px, 24vw, 220px);
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      .app-loader__track::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 42%;
        border-radius: 999px;
        background: linear-gradient(90deg, #4945ff, #6e8bff, #b47bff);
        animation: app-loader-sweep 1.25s ease-in-out infinite;
      }

      @keyframes app-loader-in {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes app-loader-breathe {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.035);
          opacity: 0.92;
        }
      }
      @keyframes app-loader-sweep {
        0% {
          left: -45%;
        }
        100% {
          left: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loader__logo {
          animation: app-loader-in 0.4s ease forwards;
        }
        .app-loader__track::after {
          animation: none;
          width: 100%;
          opacity: 0.6;
        }
        #app-loader {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- Record when the loader first paints so we can guarantee a
         minimum visible time (handled in main.tsx). -->
    <script>
      window.__appLoaderStart = performance.now();
    </script>

    <!-- Instant branded loader; React removes this once mounted. -->
    <div id="app-loader" role="status" aria-live="polite" aria-label="Loading Delt">
      <img class="app-loader__logo" src="/delt-logo.svg" alt="Delt" />
      <div class="app-loader__track" aria-hidden="true"></div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
