# Rotates the email-related secrets on the Supabase edge functions
# (Plaid connect-link + reminder emails, MPA notifications).
#
# Run on demand: Actions → "Rotate email secrets" → Run workflow.
# Reads the values from repo Actions secrets:
#   RESEND_API_KEY         — the Resend key the edge functions should send with
#   PLAID_EMAIL_FROM       — optional; from-address for Plaid lifecycle emails
#                             (must be on a domain verified in the Resend account)
#   RESEND_WEBHOOK_SECRET  — optional; Svix signing secret (whsec_…) for the
#                             resend-webhook function

name: Rotate email secrets

on:
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ytemrmpnwmzqeradbeoa
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Fail fast if secrets are missing
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repo secret is not set."
            exit 1
          fi
          if [ -z "${{ secrets.RESEND_API_KEY }}" ]; then
            echo "::error::RESEND_API_KEY repo secret is not set."
            exit 1
          fi

      - name: Rotate secrets
        run: |
          supabase secrets set RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" --project-ref "$SUPABASE_PROJECT_ID"
          if [ -n "${{ secrets.PLAID_EMAIL_FROM }}" ]; then
            supabase secrets set PLAID_EMAIL_FROM="${{ secrets.PLAID_EMAIL_FROM }}" --project-ref "$SUPABASE_PROJECT_ID"
          fi
          if [ -n "${{ secrets.RESEND_WEBHOOK_SECRET }}" ]; then
            supabase secrets set RESEND_WEBHOOK_SECRET="${{ secrets.RESEND_WEBHOOK_SECRET }}" --project-ref "$SUPABASE_PROJECT_ID"
          fi
