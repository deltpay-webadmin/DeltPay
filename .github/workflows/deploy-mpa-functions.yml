# Deploys the MPA boarding edge functions (mpa-application, docusign,
# docusign-connect) from GitHub's servers — same pattern as
# deploy-plaid-functions.yml.
#
# Also pushes the APP_ENCRYPTION_KEY function secret (repo secret of the
# same name) and uploads the blank processor MPA PDFs from
# docs/mpa-templates/ into the private mpa-templates storage bucket.
#
# Runs automatically when MPA function code changes on main, or on demand
# via Actions → "Deploy MPA edge functions" → Run workflow.

name: Deploy MPA edge functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/mpa-application/**"
      - "supabase/functions/docusign/**"
      - "supabase/functions/docusign-connect/**"
      - "supabase/functions/_shared/**"
      - "docs/mpa-templates/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ytemrmpnwmzqeradbeoa
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Fail fast if the token secret is missing
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repo secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Set the application encryption key
        env:
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
        run: |
          if [ -n "$APP_ENCRYPTION_KEY" ]; then
            supabase secrets set APP_ENCRYPTION_KEY="$APP_ENCRYPTION_KEY" --project-ref "$SUPABASE_PROJECT_ID"
          else
            echo "::warning::APP_ENCRYPTION_KEY repo secret is not set — skipping. Sensitive-field encryption will fail until it is set."
          fi

      - name: Deploy functions
        run: |
          supabase functions deploy mpa-application --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy docusign --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy docusign-connect --project-ref "$SUPABASE_PROJECT_ID"

      - name: Upload blank MPA templates to storage
        continue-on-error: true
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" || true
          supabase --experimental storage cp ./docs/mpa-templates/luqra-mpa-v1.pdf ss:///mpa-templates/luqra/mpa-v1.pdf || echo "::warning::Template upload failed — upload docs/mpa-templates/luqra-mpa-v1.pdf to mpa-templates/luqra/mpa-v1.pdf via the dashboard."
          supabase --experimental storage cp ./docs/mpa-templates/paysafe-mpa-v1.pdf ss:///mpa-templates/paysafe/mpa-v1.pdf || echo "::warning::Template upload failed — upload docs/mpa-templates/paysafe-mpa-v1.pdf to mpa-templates/paysafe/mpa-v1.pdf via the dashboard."
