name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Dummy data guard
        run: npm run check:dummy-data
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Edge function syntax/import check
        run: npm run check:functions
