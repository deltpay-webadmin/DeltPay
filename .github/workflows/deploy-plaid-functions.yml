# Deploys the Supabase edge functions from GitHub's servers — no local
# terminal or Supabase CLI install needed.
#
# Runs automatically when function code changes on main, or on demand via
# Actions → "Deploy Supabase edge functions" → Run workflow.
#
# One-time setup: repo Settings → Secrets and variables → Actions → add
#   SUPABASE_ACCESS_TOKEN  (Supabase dashboard → account avatar →
#                           Access Tokens → Generate new token)
#
# All eight functions deploy together. A change to _shared/ affects several
# of them at once (e.g. docusign_status.ts is imported by both the server
# and docusign-connect), so partial deploys leave stale copies serving
# traffic — the previous three-function scope did exactly that.

name: Deploy Supabase edge functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ytemrmpnwmzqeradbeoa
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Fail fast if the token secret is missing
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repo secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy functions
        run: |
          # make-server-940653c6 maps to functions/server via config.toml.
          for fn in make-server-940653c6 plaid-webhook plaid-config-check \
                    docusign docusign-connect analyze-statement \
                    extract-deal-doc nebius-chat; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_ID"
          done
