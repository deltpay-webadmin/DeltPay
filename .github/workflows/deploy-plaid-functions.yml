# Deploys the Plaid-related Supabase edge functions from GitHub's servers —
# no local terminal or Supabase CLI install needed.
#
# Runs automatically when Plaid function code changes on main, or on demand
# via Actions → "Deploy Plaid edge functions" → Run workflow.
#
# One-time setup: repo Settings → Secrets and variables → Actions → add
#   SUPABASE_ACCESS_TOKEN  (Supabase dashboard → account avatar →
#                           Access Tokens → Generate new token)
#
# Scope is deliberately limited to the three Plaid functions (the slugs the
# CRM and Plaid actually call — see supabase/config.toml for the
# make-server-940653c6 entrypoint mapping). Other functions are deployed by
# their own processes; widen the list only after confirming the repo copy
# is the live source of truth for them.

name: Deploy Plaid edge functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/server/**"
      - "supabase/functions/plaid-webhook/**"
      - "supabase/functions/plaid-config-check/**"
      - "supabase/functions/resend-webhook/**"
      - "supabase/functions/email-unsubscribe/**"
      - "supabase/functions/_shared/**"
      - "supabase/config.toml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ytemrmpnwmzqeradbeoa
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Fail fast if the token secret is missing
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repo secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy functions
        run: |
          supabase functions deploy make-server-940653c6 --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy plaid-webhook --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy plaid-config-check --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy resend-webhook --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
          # Public unsubscribe endpoint: auth is the HMAC token in the URL,
          # not a JWT — recipients click it straight from an email.
          supabase functions deploy email-unsubscribe --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
